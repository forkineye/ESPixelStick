name: Automated Gemini Code Review

on:
  push:
    branches:
      - '**' # Triggers on a push to any branch, including main

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required if you want it to comment on PRs when they exist

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches the current commit and its parent to get the diff

      - name: Get Code Diff
        id: git_diff
        run: |
          # Captures the changes introduced by this specific push
          git diff HEAD^ HEAD > diff.txt
          echo "DIFF_EXISTS=$([ -s diff.txt ] && echo 'true' || echo 'false')" >> $GITHUB_ENV

      - name: Run Gemini AI Reviewer
        if: env.DIFF_EXISTS == 'true'
        uses: google-gemini/github-actions-run-gemini-cli@v1 # Or a validated marketplace action like coderabbit/gemini-review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          # Custom instructions for pushing to main vs branches
          prompt: |
            You are an expert code reviewer. Review the following code diff for security vulnerabilities, bugs, and performance bottlenecks.
            If this push is directly to the 'main' branch, flag any high-risk changes immediately.
            Provide actionable, concise feedback.
          input_file: diff.txt